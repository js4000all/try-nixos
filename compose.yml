services:
  nix:
    build:
      context: .
    stdin_open: true
    tty: false
    environment:
      HOME: /home/nix
      USER: nix
      NIX_REMOTE: local
      NIX_CONFIG: ${NIX_CONFIG:-}
      NIXPKGS_ALLOW_UNFREE: ${NIXPKGS_ALLOW_UNFREE:-0}
    volumes:
      - ./:/workspace
      - nix-store:/nix
      - ./container/gitconfig:/root/.gitconfig:ro

volumes:
  nix-store:
